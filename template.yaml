# Metadatos de la plantilla para el catálogo de NoExpertise.
id: asesoria-gestoria
nombre: Asesoría y gestoría
descripcion: Web sobria para asesorías y gestorías, con servicios por cliente, planes de cuota y calendario fiscal.
sectores:
  - { id: asesoria, nombre: Asesoría }
  - { id: gestoria, nombre: Gestoría }
  - { id: contable, nombre: Asesoría contable }
  - { id: fiscal, nombre: Asesoría fiscal }
  - { id: laboral, nombre: Asesoría laboral }
  - { id: administrador-fincas, nombre: Administrador de fincas }
secciones:
  - { id: hero, nombre: Portada }
  - { id: servicios, nombre: Servicios }
  - { id: planes, nombre: Planes }
  - { id: proceso, nombre: Alta en tres pasos }
  - { id: plazos, nombre: Calendario fiscal }
  - { id: equipo, nombre: Equipo }
  - { id: cita, nombre: Primera consulta gratis }
  - { id: opiniones, nombre: Opiniones }
  - { id: preguntas, nombre: Preguntas frecuentes }
  - { id: contacto, nombre: Contacto }
estilo: sobrio
plan_minimo: presencia
version: 1.2.2
base: astrowind
demo_url: https://demo-plantilla-asesoria-gestoria.noexpertise.com
activa: true
orden: 520

# Páginas propias (docs/plantillas.md § Fichas por elemento y páginas por zona). Espejo en src/data/fichas.ts.
fichas:
  - { lista: servicios, campo: servicios, ruta: servicios, nombre: Servicio, tipo: Service }

# Varias páginas (docs/plantillas.md § Varias páginas): reparto recomendado al activar «Varias páginas».
# Inicio se queda con la portada y lo que no esté en ninguna página (aquí, alta en tres pasos, calendario fiscal).
paginas:
  - { ruta: servicios, titulo: Servicios, secciones: "servicios; planes" }
  - { ruta: la-asesoria, titulo: La asesoría, secciones: "equipo; opiniones" }
  - { ruta: contacto, titulo: Contacto, secciones: "cita; preguntas; contacto" }

# Asistente de puesta en marcha (NoExpertise): un paso por pantalla. Rutas del site sin índices;
# tipos: texto y lista (la IA propone), datos, fotos, eleccion (colores y logo) y repaso.
asistente:
  - id: negocio
    titulo: "Tu asesoría"
    pregunta: "¿Cómo se llama tu asesoría y a quién ayudáis?"
    ayuda: "Qué lleváis (impuestos, nóminas, contabilidad…), para quién y desde dónde."
    tipo: texto
    campos: [nombre, eslogan, seo.titulo, seo.descripcion, secciones.hero.antetitulo, secciones.hero.titulo, secciones.hero.texto]
  - id: contacto
    titulo: "Cómo te encuentran"
    pregunta: "¿Dónde está la oficina y cómo os pueden llamar o escribir?"
    ayuda: "Solo lo que quieras que vean tus clientes. Lo que dejes vacío no sale en tu web."
    tipo: datos
    campos: [contacto.telefono, contacto.whatsapp, contacto.email, contacto.direccion, contacto.horario, redes.linkedin, redes.facebook, redes.instagram]
  - id: servicios
    titulo: "Tus servicios"
    pregunta: "¿Qué servicios ofrecéis? Uno por línea, y para quién es cada uno: autónomos, pymes o particulares."
    ayuda: "Por ejemplo: alta de autónomo (autónomos), nóminas (pymes), declaración de la renta (particulares)…"
    tipo: lista
    campos: [secciones.servicios.servicios]
  - id: planes
    titulo: "Planes y cuotas"
    pregunta: "¿Tenéis cuotas fijas? Escribe cada plan con su precio y lo que incluye, uno por línea."
    ayuda: "Es opcional: si prefieres no poner precios, salta este paso y oculta el apartado en Contenido."
    tipo: lista
    campos: [secciones.planes.planes]
  - id: proceso
    titulo: "Cómo se da de alta un cliente"
    pregunta: "¿Qué pasos sigue alguien que se cambia a vuestra asesoría?"
    tipo: texto
    campos: [secciones.proceso.titulo, secciones.proceso.items]
  - id: plazos
    titulo: "Calendario fiscal"
    pregunta: "¿Qué fechas quieres recordar a tus clientes? Una por línea, con el día y lo que hay que presentar."
    ayuda: "Por ejemplo: 20 de abril, IVA y pagos fraccionados del primer trimestre."
    tipo: lista
    campos: [secciones.plazos.plazos]
  - id: equipo
    titulo: "Tu equipo"
    pregunta: "¿Quién forma la asesoría? Nombre y especialidad de cada uno, uno por línea."
    ayuda: "Las fotos las pones luego en Contenido."
    tipo: lista
    campos: [secciones.equipo.personas]
  - id: cita
    titulo: "Primera consulta"
    pregunta: "¿Cómo es la primera consulta? ¿Es gratis, cuánto dura y dónde se hace?"
    tipo: texto
    campos: [secciones.cita.titulo, secciones.cita.texto, secciones.cita.items]
  - id: preguntas
    titulo: "Preguntas frecuentes"
    pregunta: "¿Qué os preguntan más a menudo? Escribe cada pregunta y lo que respondéis."
    ayuda: "Si lo prefieres, añádelas luego en Contenido."
    tipo: lista
    campos: [secciones.preguntas.preguntas]
  - id: fotos
    titulo: "Tus fotos"
    pregunta: "Pon una foto de portada y, si quieres, alguna más de la oficina."
    ayuda: "Sube las tuyas o elige una del banco. Las que no cambies se quedan como están."
    tipo: fotos
    campos: [secciones.hero.imagen, secciones.proceso.galeria, secciones.plazos.imagen, secciones.cita.imagen, secciones.contacto.imagen]
  - id: aspecto
    titulo: "Colores y logo"
    pregunta: "Elige los colores de tu web y, si tienes, tu logo."
    tipo: eleccion
    campos: [colores.primario, colores.acento, logo]
  - id: repaso
    titulo: "Repaso"
    tipo: repaso
