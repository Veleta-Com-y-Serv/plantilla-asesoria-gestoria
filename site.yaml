# Negocio de ejemplo ficticio: nombres, teléfonos y correo inventados.
nombre: Asesoría Onyar
eslogan: Asesoría fiscal, laboral y contable en Girona para autónomos, pymes y particulares.
sector: asesoria
logo: ""          # ruta a una imagen en public/ (p. ej. /logo.svg). Vacío = inicial y nombre en texto.
colores:
  primario: "#1f4d3a"
  acento: "#d8c3a0"
  fondo: "#ffffff"
  texto: "#14231c"
contacto:
  telefono: "972 41 28 60"
  email: hola@asesoriaonyar.es
  direccion: "Carrer de la Força 22, 1.º, 17004 Girona"
  horario: Lunes a jueves de 8:30 a 14:00 y de 15:30 a 18:30. Viernes de 8:30 a 14:30.
  whatsapp: "+34 623 41 28 60"
redes:
  instagram: ""
  facebook: ""
  linkedin: https://www.linkedin.com/
menu:
  - { texto: Servicios, url: "/#servicios" }
  - { texto: Planes, url: "/#planes" }
